<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Translator</title>
    <link rel="stylesheet" href="styles/output.css">
</head>

<style>
</style>

<body class="m-0 box-border min-h-screen flex flex-col bg-black text-[#a0f7a0]">

    <div class="relative flex min-h-screen w-full flex-col
                items-center justify-center gap-3
                px-3 py-6 sm:gap-4 sm:px-6 sm:py-8">

        <h1 class="w-full max-w-2xl border-b border-green-500
                   bg-black py-3 text-center text-lg font-bold uppercase
                   tracking-wide text-green-400
                   drop-shadow-[0_0_10px_#00ff7f]
                   animate-pulse-slow
                   sm:text-2xl sm:tracking-wider md:text-3xl">
            Morse Code Translator
        </h1>

        <textarea
            id="input1"
            class="command-prompt min-h-[120px] w-full max-w-2xl
                   resize-y rounded-md border border-green-700
                   bg-black px-3 py-3 text-sm text-green-500
                   shadow-[0_0_8px_#00ff7f]
                   placeholder:text-green-800
                   focus:border-green-400 focus:outline-none
                   focus:ring-1 focus:ring-green-500
                   sm:min-h-[150px] sm:px-4 sm:text-base"
            title="input"
            placeholder="English text..."
        ></textarea>

        <textarea
            id="input2"
            class="min-h-[120px] w-full max-w-2xl
                   resize-y rounded-md border border-green-700
                   bg-black px-3 py-3 text-sm text-green-500
                   shadow-[0_0_8px_#00ff7f]
                   placeholder:text-green-800
                   focus:outline-none
                   sm:min-h-[150px] sm:px-4 sm:text-base
                   cursor-default"
            title="output"
            placeholder="Morse code..."
            disabled
        ></textarea>

        <div class="command-prompt w-full max-w-md
                    border-t border-green-600 bg-black
                    px-2 py-4 text-center text-[10px]
                    uppercase tracking-[0.12em] text-green-400
                    shadow-[0_-0_15px_#00ff7f]
                    drop-shadow-[0_0_10px_#00ff7f]
                    sm:text-xs md:text-sm sm:tracking-widest">
            Coded by Mohammad Mesgarzadeh 2026
        </div>

        <footer class="mt-2 flex min-h-20 w-full items-center
                       justify-center gap-3 border-t border-x-0
                       border-green-600 bg-black px-2 py-4
                       shadow-[0_-8px_15px_-12px_#00ff7f]
                       sm:mt-5 sm:gap-5">

            <!-- GitHub -->
            <a
                class="flex h-10 w-10 shrink-0 items-center justify-center
                       rounded-full border border-green-500 bg-black p-2
                       shadow-[0_0_10px_#00ff7f]
                       transition duration-300
                       hover:-translate-y-1 hover:shadow-[0_0_20px_#00ff7f]
                       sm:h-12 sm:w-12"
                href="https://github.com/mohammad-mesgarzadeh"
                aria-label="GitHub"
            >
                <img
                    src="images/icons/GitHub.png"
                    alt=""
                    class="h-full w-full object-contain invert"
                >
            </a>

            <!-- LinkedIn -->
            <a
                class="flex h-10 w-10 shrink-0 items-center justify-center
                       rounded-full border border-green-500 bg-black p-2
                       shadow-[0_0_10px_#00ff7f]
                       transition duration-300
                       hover:-translate-y-1 hover:shadow-[0_0_20px_#00ff7f]
                       sm:h-12 sm:w-12"
                href="https://www.linkedin.com/in/mohammad-mesgarzade-a5422837a/"
                aria-label="LinkedIn"
            >
                <img
                    src="images/icons/Linkedin(black&white).png"
                    alt=""
                    class="h-full w-full object-contain invert"
                >
            </a>

            <!-- Email -->
            <div class="group relative shrink-0">

                <div class="pointer-events-none absolute bottom-full
                            left-1/2 z-10 mb-3 -translate-x-1/2
                            scale-90 whitespace-nowrap rounded-lg
                            border border-green-500 bg-black
                            px-3 py-2 text-xs font-semibold
                            text-green-300 opacity-0
                            shadow-[0_0_10px_#00ff7f]
                            transition-all duration-300
                            group-hover:scale-100 group-hover:opacity-100
                            sm:text-sm">
                    m_mesgarzade@yahoo.com
                </div>

                <a
                    href="mailto:m_mesgarzade@yahoo.com"
                    aria-label="Email"
                    class="flex h-10 w-10 items-center justify-center
                           rounded-full border border-green-500 bg-black p-2
                           shadow-[0_0_10px_#00ff7f]
                           transition duration-300
                           hover:-translate-y-1 hover:shadow-[0_0_20px_#00ff7f]
                           sm:h-12 sm:w-12"
                >
                    <img
                        src="images/icons/email.png"
                        alt=""
                        class="h-full w-full object-contain invert"
                    >
                </a>
            </div>

            <!-- Phone -->
            <div class="group relative shrink-0">

                <div class="pointer-events-none absolute bottom-full
                            left-1/2 z-10 mb-3 -translate-x-1/2
                            scale-90 whitespace-nowrap rounded-lg
                            border border-green-500 bg-black
                            px-3 py-2 text-xs font-semibold
                            text-green-300 opacity-0
                            shadow-[0_0_10px_#00ff7f]
                            transition-all duration-300
                            group-hover:scale-100 group-hover:opacity-100
                            sm:text-sm">
                    09336153916
                </div>

                <a
                    href="tel:09336153916"
                    aria-label="Phone"
                    class="flex h-10 w-10 items-center justify-center
                           rounded-full border border-green-500 bg-black p-2
                           shadow-[0_0_10px_#00ff7f]
                           transition duration-300
                           hover:-translate-y-1 hover:shadow-[0_0_20px_#00ff7f]
                           sm:h-12 sm:w-12"
                >
                    <img
                        src="images/icons/Phone.png"
                        alt=""
                        class="h-full w-full object-contain invert"
                    >
                </a>
            </div>

        </footer>

        <canvas
            id="matrix"
            class="pointer-events-none fixed inset-0 -z-10 h-full w-full bg-black"
        ></canvas>

    </div>

    <script src="app.js"></script>

</body>

</html>
